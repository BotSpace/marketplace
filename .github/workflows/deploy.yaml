name: Build and Push Docker Image (tag + latest)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  PROJECT_NAME: botmother-market

permissions:
  contents: write

jobs:
  build-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^DEBUG=.*|DEBUG=true|" .env
          sed -i "s|^NODE_ENV=.*|NODE_ENV=production|" .env
          sed -i "s|^NEXT_PUBLIC_API=.*|NEXT_PUBLIC_API=${{ vars.NEXT_PUBLIC_URL }}|" .env
          sed -i "s|^CONSTRUCTOR_URL=.*|CONSTRUCTOR_URL=${{ vars.CONSTRUCTOR_URL }}|" .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}|" .env
          sed -i "s|^NEXTAUTH_URL=.*|NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}|" .env
          sed -i "s|^MANAGER_URL=.*|MANAGER_URL=${{ vars.MANAGER_URL }}|" .env
          sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${{ secrets.BOT_TOKEN }}|" .env
          sed -i "s|^SALES_URL=.*|SALES_URL=${{ vars.SALES_URL }}|" .env
          sed -i "s|^ADMIN_PANEL=.*|ADMIN_PANEL=${{ vars.ADMIN_PANEL }}|" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ env.SHORT_SHA }}
            ${{ vars.DOCKER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
